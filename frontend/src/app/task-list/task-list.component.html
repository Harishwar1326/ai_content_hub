
<div *ngIf="!list; else showList" class="p-8 text-center text-gray-500">
  <h2 class="text-2xl font-bold">Select a list</h2>
  <p>Choose a list from the sidebar or create a new one to get started.</p>
</div>

<ng-template #showList>
  <div class="p-6 h-full flex flex-col">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-3xl font-bold text-white">{{ list?.name }}</h2>
      <!-- Analyze Hub Button would go here -->
    </div>

    <!-- Smart Filters would be implemented here -->

    <div class="space-y-4 overflow-y-auto flex-grow">
      <div *ngIf="list?.items && list.items.length > 0; else emptyList">
        <!-- Loop through items using *ngFor -->
        <div *ngFor="let item of list.items; trackBy: trackById" class="task-item-container">
          <!-- The TaskItem component would be here -->
          <!-- Example: <app-task-item [item]="item"></app-task-item> -->
           <div class="flex items-start p-4 bg-gray-800 rounded-lg shadow-md hover:bg-gray-700 cursor-pointer transition-colors border border-gray-700 space-x-4">
              <p class="font-semibold text-gray-100">{{ item.title }}</p>
           </div>
        </div>
      </div>
      <ng-template #emptyList>
        <div class="text-center py-16 px-4 bg-gray-800 rounded-lg border-2 border-dashed border-gray-700">
          <h3 class="text-xl font-semibold text-gray-300">This Hub is empty</h3>
        </div>
      </ng-template>
    </div>
  </div>
</ng-template>
